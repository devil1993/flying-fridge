<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#4F6DF5" />
    <!-- Launch as a standalone app (no browser URL bar / back button) once added
         to the home screen. `display: standalone` in the manifest covers
         Android/Chrome/desktop; iOS needs these apple-* tags. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Flying Fridge" />
    <meta
      name="description"
      content="Flying Fridge — the digital noticeboard for families. Tasks, notices, pantry, lost & found and questions, on a fridge door that travels with you."
    />
    <title>Flying Fridge</title>
    <!-- Display font: Baloo Da 2 covers Bengali + Latin; Baloo 2 is a Latin companion.
         Two weights: 400 for body use, 700 for headings. display=swap keeps text visible
         during load. Both are ~34 kB combined for the two weights. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+Da+2:wght@400;600;700&family=Baloo+2:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
